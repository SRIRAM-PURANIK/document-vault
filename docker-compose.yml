services:
  postgres:
    image: postgres:16
    container_name: document-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: document_vault
    ports:
      - "5433:5432"
    volumes:
      - vault-data:/var/lib/postgresql/data
volumes:
  vault-data:
